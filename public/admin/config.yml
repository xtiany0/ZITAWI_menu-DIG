backend:
  name: git-gateway
  branch: main

locale: fr
publish_mode: simple
media_folder: public/images/menu
public_folder: /images/menu

collections:
  - name: menu
    label: Carte
    label_singular: Plat
    folder: src/content/menu
    create: true
    slug: "{{fields.category}}--{{slug}}"
    identifier_field: name_fr
    summary: "{{fields.name_fr}} - {{fields.price}}F"
    sortable_fields: [category, price, name_fr]
    view_groups:
      - label: Catégorie
        field: category
    fields:
      - label: "Nom (français)"
        name: name_fr
        widget: string
        hint: "Le nom affiché sur la carte française."

      - label: "Nom (anglais)"
        name: name_en
        widget: string
        hint: "Le nom affiché sur la carte anglaise."

      - label: "Catégorie"
        name: category
        widget: select
        options:
          - { label: "Pizzas", value: "pizzas" }
          - { label: "Plats", value: "plats" }
          - { label: "Sandwichs", value: "sandwichs" }
          - { label: "Boissons", value: "boissons" }

      - label: "Prix en FCFA"
        name: price
        widget: number
        value_type: int
        min: 0
        step: 50
        hint: "Chiffres seulement, sans le mot FCFA. Exemple : 4500"

      - label: "Ingrédients (français)"
        name: description_fr
        widget: text
        required: false
        hint: "Liste courte, séparée par des virgules. Laisser vide si inutile."

      - label: "Ingrédients (anglais)"
        name: description_en
        widget: text
        required: false

      - label: "Second prix"
        name: price_alt
        widget: number
        value_type: int
        required: false
        min: 0
        step: 50
        hint: "Uniquement si le plat a deux tarifs, affichés 3.000 / 10.000F. Décrire les deux options dans les ingrédients, exemple : la douzaine / le kilo."

      - label: "Photo du plat"
        name: image
        widget: image
        required: false
        hint: "Photo prise de haut, en lumière du jour. Format paysage."

      - label: "Disponible aujourd'hui"
        name: available
        widget: boolean
        default: true
        hint: "Décocher pour afficher le plat comme épuisé, sans le supprimer."

      - label: "Ordre d'affichage"
        name: order
        widget: number
        value_type: int
        default: 100
        hint: "Un petit nombre fait remonter le plat dans sa catégorie."

      - label: "Notes internes"
        name: body
        widget: markdown
        required: false
        hint: "Non affiché sur le site."
